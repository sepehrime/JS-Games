<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JS Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Rubik:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1><span aria-hidden="true">👾</span> JS Games <span aria-hidden="true">👾</span></h1>
      <h2>Welcome to JS Games! Enjoy Playing!</h2>
    </header>
    <section>
      <nav>
        <!-- Filled in by app.js from the games list -->
        <ul id="game-list"></ul>
      </nav>
      <!-- Each game draws itself in here -->
      <main id="game-container">
        <h2>Game</h2>
        <h3>Select a game from the menu!</h3>
      </main>
    </section>
    <footer>2026 JS Games</footer>
    <script type="module" src="app.js"></script>
  </body>
</html>
